#TEST - PACKAR UPP, VÄLJER SEM, LÄGGER DET I TEST
shell_command:
  update_packages_from_github: >
    bash -c "
      cd /config && \
      mkdir -p /config/packages/TEST && \
      curl -L -o repo.zip https://github.com/Henrik1986/huawei-energy-managment/archive/refs/heads/main.zip && \
      unzip -o repo.zip -d /config/tmp_repo && \
      cp -r /config/tmp_repo/huawei-energy-managment-main/sem/* /config/packages/TEST && \
      rm repo.zip && \
      rm -rf /config/tmp_repo
    "


  test_sem_github_install: >
    bash -c "
      cd /config &&

      echo '--- CLEAN ---' &&
      rm -rf /config/tmp_sem_test &&
      rm -f sem_test.zip &&

      echo '--- CREATE FOLDERS ---' &&
      mkdir -p /config/packages/sem_test &&
      mkdir -p /config/dashboards &&

      echo '--- DOWNLOAD REPO ---' &&
      curl -L -o sem_test.zip https://github.com/Henrik1986/huawei-energy-managment/archive/refs/heads/main.zip &&

      echo '--- UNZIP ---' &&
      unzip -o sem_test.zip -d /config/tmp_sem_test &&

      echo '--- BACKEND COPY ---' &&
      cp -r /config/tmp_sem_test/huawei-energy-managment-main/sem/* /config/packages/sem_test/ &&

      echo '--- FRONTEND COPY ---' &&
      cp -r /config/tmp_sem_test/huawei-energy-managment-main/dashboards/* /config/dashboards/ &&

      echo '--- CLEANUP ---' &&
      rm -rf sem_test.zip /config/tmp_sem_test &&

      echo 'TEST COMPLETE'
    "

